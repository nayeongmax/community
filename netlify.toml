# 커뮤니티 플랫폼 · Netlify 배포 설정
#
# 저장소 루트가 곧 이 프로젝트이므로 base 를 두지 않는다.
# (예전 설정은 프로젝트가 community/ 하위에 있을 때의 경로였다)
[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA 라우팅: 모든 경로를 index.html 로
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
