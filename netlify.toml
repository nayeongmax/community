# Netlify 배포 설정
#
# 이 앱은 Next.js 서버 렌더링을 씁니다. 글 주소를 요청하면 서버가
# 완성된 HTML 을 만들어 주기 때문에, 네이버·구글 로봇이 JS 없이도
# 글 내용을 읽을 수 있습니다.
#
# 그래서 정적 폴더만 올리면 안 되고, 아래 플러그인이 필요합니다.
# (예전 Vite 시절 설정 — publish = "dist" — 은 더 이상 맞지 않습니다)

[build]
  command = "npm run build"
  # 아래 publish 는 플러그인이 알아서 다루므로 건드리지 않습니다.
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
